<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Planet Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --glass: rgba(16,34,64,.36);
  --glass-edge: rgba(255,255,255,.28);
  --press: rgba(255,206,64,.62);
  --ink: #ffffff;
  --thrust: #86e04a;
  --brake: #ff7b47;
  --bg: #0a1430;
  --b: clamp(50px, 14.5vw, 66px);
  --d: clamp(112px, min(36vh,34vw), 150px);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --glass: rgba(10,22,44,.42); --bg:#070f24; } }
:root[data-theme="dark"]{ --glass: rgba(10,22,44,.42); --bg:#070f24; }
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
html,body{ height:100%; margin:0; overflow:hidden; background:var(--bg); }
body{ font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif; color:var(--ink);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
#game{ position:fixed; inset:0; }
#game canvas{ display:block; width:100%; height:100%; }

#hud{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:calc(12px + env(safe-area-inset-left,0px));
  display:flex; gap:14px; padding:6px 14px; border-radius:16px; background:var(--glass); border:1.5px solid var(--glass-edge);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); line-height:1; align-items:baseline; }
#hud b{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
#hud span{ font-size:13px; opacity:.8; margin-left:3px; }
#warn{ position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
  padding:4px 14px; border-radius:12px; background:#e5383b; font-weight:800; font-size:16px; opacity:0; transition:opacity .15s; }
#warn.show{ opacity:1; }
#msg{ position:fixed; top:38%; left:50%; transform:translate(-50%,-50%); font-size:clamp(26px,7vw,40px); font-weight:800;
  text-shadow:0 3px 0 rgba(0,0,0,.25); opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
#msg.show{ opacity:1; }
#topr{ position:fixed; z-index:3; top:calc(10px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); display:flex; gap:8px; }
.tb{ height:42px; padding:0 16px; font-size:16px; font-weight:800; }
#minimap{ position:fixed; z-index:2; top:calc(58px + env(safe-area-inset-top,0px)); left:calc(12px + env(safe-area-inset-left,0px));
  width:clamp(84px,min(25vh,30vw),130px); height:clamp(84px,min(25vh,30vw),130px); border-radius:50%; touch-action:none; cursor:pointer; }
#toasts{ position:fixed; z-index:4; top:calc(48px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
.toast{ padding:4px 14px; border-radius:12px; background:rgba(255,201,60,.92); color:#3a2a00; font-weight:800; font-size:15px; white-space:nowrap; transition:opacity .4s, transform .4s; }
.toast.out{ opacity:0; transform:translateY(-8px); }
.coin{ display:inline-block; width:14px; height:14px; border-radius:50%; background:#ffc93c; box-shadow:inset 0 0 0 2px #e0a520; margin-right:5px; vertical-align:-1px; }
#worldmap{ position:fixed; inset:0; z-index:10; }
#worldmap canvas{ width:100%; height:100%; display:block; }
#hangar{ position:fixed; inset:0; z-index:10; background:rgba(5,12,28,.7); display:grid; place-items:center; padding:12px; box-sizing:border-box; }
[hidden]{ display:none !important; }
.hgpanel{ width:min(560px,100%); max-height:calc(100vh - 24px); overflow:auto; touch-action:pan-y; background:#13284a; border:1.5px solid var(--glass-edge); border-radius:20px; padding:14px 16px; box-sizing:border-box; }
.hghead{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
.hghead h2{ margin:0; font-size:24px; } .hghead .bal{ font-size:18px; font-weight:800; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid rgba(255,255,255,.12); }
.row.paint{ padding-bottom:4px; }
.info b{ font-size:17px; display:block; line-height:1.1; } .info small{ opacity:.75; font-size:13px; }
.pips{ display:flex; gap:4px; margin-top:4px; } .pips i{ width:18px; height:6px; border-radius:3px; background:rgba(255,255,255,.2); } .pips i.on{ background:#86e04a; }
.buy,.closeb{ font:inherit; font-weight:800; font-size:15px; border:0; border-radius:12px; padding:8px 14px; background:#ffc93c; color:#3a2a00; white-space:nowrap; }
.buy:disabled{ background:rgba(255,255,255,.15); color:rgba(255,255,255,.55); }
.closeb{ background:rgba(255,255,255,.18); color:#fff; }
.paints{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; padding-bottom:4px; }
.sw{ font:inherit; font-weight:800; font-size:13px; color:#fff; background:rgba(255,255,255,.08); border:2px solid transparent; border-radius:12px; padding:6px; display:flex; flex-direction:column; align-items:center; gap:3px; }
.sw span{ width:44px; height:24px; border-radius:6px; } .sw small{ font-weight:600; opacity:.75; font-size:11px; }
.sw.sel{ border-color:#86e04a; } .sw:disabled{ opacity:.45; }
.sec{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; opacity:.7; margin:12px 0 6px; }
.acs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.ac{ font:inherit; color:#fff; text-align:left; background:rgba(255,255,255,.08); border:2px solid transparent; border-radius:14px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; }
.ac b{ font-size:16px; line-height:1.1; } .ac small{ font-size:11.5px; opacity:.75; line-height:1.2; margin-bottom:3px; }
.ac .st{ font-size:11px; font-weight:700; display:flex; justify-content:space-between; align-items:center; opacity:.9; }
.bars{ display:flex; gap:2px; } .bars i{ width:9px; height:5px; border-radius:2px; background:rgba(255,255,255,.2); } .bars i.on{ background:#5ff2ff; }
.ac em{ font-style:normal; font-weight:800; font-size:13px; margin-top:4px; color:#ffc93c; }
.ac.sel{ border-color:#86e04a; } .ac.sel em{ color:#86e04a; } .ac:disabled{ opacity:.45; }

.ctl{ position:fixed; z-index:2; display:flex; }
#left{ left:calc(12px + env(safe-area-inset-left,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
#right{ right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
.btn{ background:var(--glass); border:1.5px solid var(--glass-edge); color:var(--ink); border-radius:18px;
  display:grid; place-items:center; touch-action:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:transform .06s, background .06s; font:inherit; padding:0; }
.btn.on{ background:var(--press); transform:scale(.93); }
.btn svg{ width:46%; height:46%; }
.rudders{ display:flex; gap:8px; }
.rud{ width:66px; height:48px; font-size:14px; font-weight:800; line-height:1; }
.planeL{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.lever{ position:relative; width:66px; height:clamp(110px,36vh,170px); border-radius:18px; background:var(--glass); border:1.5px solid var(--glass-edge);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); touch-action:none; overflow:hidden; box-sizing:border-box; }
.lever::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:25%; background:color-mix(in srgb,var(--brake) 22%,transparent); }
.lv-fill{ position:absolute; left:0; right:0; }
.lv-notch{ position:absolute; left:6px; right:6px; bottom:25%; height:2px; background:rgba(255,255,255,.75); border-radius:1px; }
.lv-lab{ position:absolute; left:0; right:0; text-align:center; font-size:11px; font-weight:800; opacity:.7; pointer-events:none; }
.lv-top{ top:5px; } .lv-bot{ bottom:4px; }
.lv-handle{ position:absolute; left:4px; right:4px; height:30px; border-radius:11px; background:#fff; color:#13284a; display:grid; place-items:center;
  font-size:11px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.3); pointer-events:none; white-space:nowrap; }
.stick{ position:relative; width:var(--d); height:var(--d); border-radius:50%; background:var(--glass); border:1.5px solid var(--glass-edge);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); touch-action:none; box-sizing:border-box; }
.stick::before,.stick::after{ content:""; position:absolute; background:rgba(255,255,255,.18); }
.stick::before{ left:50%; top:12%; bottom:12%; width:1.5px; } .stick::after{ top:50%; left:12%; right:12%; height:1.5px; }
.knob{ position:absolute; left:50%; top:50%; width:42%; height:42%; margin:-21% 0 0 -21%; border-radius:50%; z-index:1;
  background:radial-gradient(circle at 38% 32%,#ffffff,#d9e2ef); box-shadow:0 3px 8px rgba(0,0,0,.35); pointer-events:none; }
.knob.back{ transition:transform .14s ease-out; }
.stick .cap{ position:absolute; left:0; right:0; top:-4px; transform:translateY(-100%); text-align:center; font-size:11px; font-weight:800; opacity:.75; pointer-events:none; white-space:nowrap; }
.stick.on{ border-color:var(--press); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud"><div><b id="spd">0</b><span>kt</span></div><div><b id="alt">0</b><span>ft</span></div><div><i class="coin"></i><b id="coins">0</b></div><div id="shBox" hidden><b id="shd">0</b><span>shield</span></div></div>
<canvas id="minimap" aria-label="Minimap, tap for world map"></canvas>
<div id="toasts"></div>
<div id="warn">Stall</div>
<div id="msg"></div>
<div id="topr"><button class="btn tb" id="hangarBtn">Hangar</button><button class="btn tb" id="mode" aria-label="Switch between plane and drone">Drone</button></div>
<div id="worldmap" hidden><canvas id="wmcanvas"></canvas></div>
<div id="hangar" hidden><div class="hgpanel"><div class="hghead"><h2>Hangar</h2><span class="bal"><i class="coin"></i><span id="hgcoins">0</span></span><button class="closeb" id="hgclose">Done</button></div><div id="hglist"></div></div></div>

<div class="ctl" id="left">
  <div id="planeL" class="planeL">
    <div id="lever" class="lever" role="slider" aria-label="Throttle and brake">
      <div class="lv-fill" id="lvFill"></div><div class="lv-notch"></div>
      <span class="lv-lab lv-top">Thrust</span><span class="lv-lab lv-bot">Brake</span>
      <div class="lv-handle" id="lvHandle"><span id="dval">Idle</span></div>
    </div>
    <div class="rudders">
      <button class="btn rud" data-k="rl" aria-label="Left rudder">L rudder</button>
      <button class="btn rud" data-k="rr" aria-label="Right rudder">R rudder</button>
    </div>
  </div>
  <div id="stickL" class="stick" hidden><div class="knob"></div><span class="cap">Climb · Spin</span></div>
</div>

<div class="ctl" id="right">
  <div id="stickR" class="stick"><div class="knob"></div><span class="cap" id="capR">Pitch · Roll</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function npcDir(n,dt){

function makeStick(el){
  const k=el.querySelector('.knob'),st={x:0,y:0,id:null};
  const move=e=>{const r=el.getBoundingClientRect(),m=r.width*0.32;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l;}k.style.transform=`translate(${dx}px,${dy}px)`;
    const cv=v=>{const a=Math.abs(v)<.06?0:v;return a*(0.45+0.55*Math.abs(a));};st.x=cv(dx/m);st.y=cv(dy/m);};

/* ---------- flight model ---------- */
const G=9.8,kL=0.0072,kD0=0.0011,kDi=0.0045,kB=0.0018,TMAX=15,kS=0.02,DMAX=1029;
const pos=V(),vel=V(),q=new THREE.Quaternion(),omega=V();
const ax={p:0,r:0,y:0};
let thr=0,onGround=true,crashed=false,crashT=0,stalled=false,dGround=false;
const camPos=V(),camHead=V(0,0,-1),camOff=V(),hd=V(0,0,-1);
const fwd=V(),up=V(),right=V(),n=V(),tmp=V(),tq=new THREE.Quaternion(),IDQ=new THREE.Quaternion();
const msgEl=document.getElementById('msg'), warnEl=document.getElementById('warn'), spdEl=document.getElementById('spd'), altEl=document.getElementById('alt'), modeBtn=document.getElementById('mode');

function terrainNormal(nn,out){
  const t1=tmp.crossVectors(nn,Math.abs(nn.y)<.9?V(0,1,0):V(1,0,0)).normalize(), t2=V().crossVectors(nn,t1), e=0.004;
  const h0=Math.max(0,Hn(nn)), a=nn.clone().addScaledVector(t1,e).normalize(), b=nn.clone().addScaledVector(t2,e).normalize();
  const p0=nn.clone().multiplyScalar(R+h0), p1=a.multiplyScalar(R+Math.max(0,Hn(a))), p2=b.multiplyScalar(R+Math.max(0,Hn(b)));
  out.crossVectors(p1.sub(p0),p2.sub(p0)).normalize(); if(out.dot(nn)<0)out.negate(); return out;
}

/* debris */
const debris=[];
function clearDebris(){debris.forEach(d=>scene.remove(d.m));debris.length=0;}
function shatter(group){
  group.position.copy(pos);group.quaternion.copy(q);group.updateMatrixWorld(true);
  const nn=V().copy(pos).normalize(), vin=vel.dot(nn), base=V().copy(vel).addScaledVector(nn,-Math.min(0,vin)*1.3).multiplyScalar(.45);
  if(base.length()>120)base.setLength(120);
  group.traverse(o=>{if(!o.isMesh||!o.visible||o.userData.noDebris)return;
    const m=new THREE.Mesh(o.geometry,o.material);o.matrixWorld.decompose(m.position,m.quaternion,m.scale);m.castShadow=true;scene.add(m);
    const v=V().copy(base).add(V(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(16)).addScaledVector(nn,4+Math.random()*8);
    debris.push({m,v,w:V(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(14)});});
}
function updDebris(dt){
  for(const d of debris){const p=d.m.position;
    d.v.addScaledVector(tmp.copy(p).normalize(),-G*dt); p.addScaledVector(d.v,dt);
    const wl=d.w.length(); if(wl>1e-4){tq.setFromAxisAngle(V().copy(d.w).divideScalar(wl),wl*dt);d.m.quaternion.premultiply(tq);}
    const nn=V().copy(p).normalize(), r=p.length(), h=Hn(nn), surf=R+Math.max(0,h)+0.15;
    if(r<surf){
      if(h<=0){p.copy(nn).multiplyScalar(R-0.1);d.v.multiplyScalar(Math.exp(-3*dt));d.w.multiplyScalar(Math.exp(-2*dt));}
      else{p.copy(nn).multiplyScalar(surf);const vr=d.v.dot(nn);if(vr<0)d.v.addScaledVector(nn,-vr*1.35);d.v.multiplyScalar(Math.exp(-5*dt));d.w.multiplyScalar(Math.exp(-4*dt));}
    }
  }
}

function spawn(){
  const a=AIRPORTS[Math.floor(Math.random()*AIRPORTS.length)], ang=-RH+5/R;
  const u=rwUp(a,ang), f=rwFwd(a,ang), rgt=V().crossVectors(f,u);
  q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(rgt,u,f.clone().negate()));
  pos.copy(rwPoint(a,ang,0,mode==='plane'?GH:DG)); hd.copy(f);
  vel.set(0,0,0); omega.set(0,0,0); thr=0; dialVal=0; renderDial();
  onGround=true; dGround=true; crashed=false; stalled=false;
  plane.visible=mode==='plane'; drone.visible=mode==='drone';
  camHead.copy(f); camPos.copy(pos).addScaledVector(f,-13).addScaledVector(u,3.2); camOff.subVectors(camPos,pos);
  clearDebris(); msgEl.classList.remove('show'); airT=0; shield=UP.shieldMax; updHud();
}

function crash(water){
  if(crashed)return; crashed=true; crashT=0;
  const nn=V().copy(pos).normalize(), sf=R+Math.max(0,Hn(nn))+0.6; if(pos.length()<sf)pos.copy(nn).multiplyScalar(sf);
  const g=mode==='plane'?plane:drone; shatter(g); g.visible=false; vel.set(0,0,0);
  msgEl.textContent=water?'Splashdown':'Crashed'; msgEl.classList.add('show');
  puffs.forEach(p=>{p.m.visible=true;p.m.position.copy(pos);p.t=0;p.m.material.color.copy(water?C(0xe8f6ff):C(0x6b6b6b));
    p.v.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(14).addScaledVector(nn,8);});
}

function step(dt){
  fwd.set(0,0,-1).applyQuaternion(q); up.set(0,1,0).applyQuaternion(q); right.set(1,0,0).applyQuaternion(q);
  const r=pos.length(); n.copy(pos).divideScalar(r);
  const alt=r-R, rho=Math.exp(-Math.max(0,alt)/900), s=vel.length();
  const vf=vel.dot(fwd), vu=vel.dot(up), vr=vel.dot(right);
  const alpha=s>2?Math.atan2(-vu,Math.max(vf,.5)):0, beta=s>2?Math.atan2(vr,Math.max(vf,.5)):0;
  const SA=0.26; let CL=0.3+5.2*alpha;
  if(alpha>SA) CL=Math.max(0.25,(0.3+5.2*SA)-(alpha-SA)*6);
  CL=clamp(CL,-1.0,1.65); stalled=!onGround&&alpha>SA&&s>3;
  const brake=Math.max(0,-dialVal);
  thr+=(Math.max(0,dialVal)-thr)*Math.min(1,dt*1.5);

  const acc=V().copy(n).multiplyScalar(-G);
  if(s>0.5){
    const vh=tmp.copy(vel).divideScalar(s), dyn=rho*s*s;
    const ld=V().copy(up).addScaledVector(vh,-up.dot(vh)); if(ld.lengthSq()>1e-6) acc.addScaledVector(ld.normalize(),kL*AC.L*dyn*CL);
    acc.addScaledVector(vh,-(kD0*AC.D+kDi*AC.Di*CL*CL+(onGround?0:brake*kB))*dyn);
    acc.addScaledVector(right,-kS*rho*s*vr);
  }
  acc.addScaledVector(fwd,thr*TMAX*AC.T*UP.eng*(0.4+0.6*rho));

  // rotation
  const eff=clamp(s/40,0,1.15)*(0.5+0.5*rho), k=Math.min(1,dt*5);
  let tp=ax.p*1.0*AC.P*UP.hand*eff-(alpha-0.05)*2.2*eff, ty=ax.y*0.55*AC.Y*UP.hand*eff-beta*2.5*eff, tr=ax.r*2.2*AC.Rl*UP.hand*eff;
  if(onGround){ ty=ax.y*0.7*(s>0.5?1:0)-beta*2.5*eff; tr=0; if(tp<0)tp=0; }
  omega.x+=(tp-omega.x)*k; omega.y+=(ty-omega.y)*k; omega.z+=(tr-omega.z)*k;
  const ang=omega.length()*dt; if(ang>1e-7){tq.setFromAxisAngle(tmp.copy(omega).normalize(),ang);q.multiply(tq).normalize();}

  vel.addScaledVector(acc,dt); pos.addScaledVector(vel,dt);

  // ground
  const r2=pos.length(); n.copy(pos).divideScalar(r2);
  const h=Hn(n), surf=R+Math.max(0,h);
  if(r2<surf+GH){
    if(h<=0&&!AC.water){crash(true);return;}
    const tn=terrainNormal(n,V());
    fwd.set(0,0,-1).applyQuaternion(q); up.set(0,1,0).applyQuaternion(q); right.set(1,0,0).applyQuaternion(q);
    const vin=vel.dot(tn);
    if(vin<-UP.gearV||up.dot(tn)<UP.gearTilt||fwd.dot(tn)<-0.25||vel.length()>UP.gearS){if(h>0&&absorb())return;crash(h<=0);return;}
    pos.copy(n).multiplyScalar(surf+GH);
    if(vin<0)vel.addScaledVector(tn,-vin);
    onGround=true;
    const vn=vel.dot(n), tang=V().copy(vel).addScaledVector(n,-vn);
    tang.multiplyScalar(Math.exp(-((h<=0?0.5:0.08)+brake*1.6)*dt));
    tang.addScaledVector(right,-tang.dot(right)*(1-Math.exp(-6*dt)));
    vel.copy(tang).addScaledVector(n,vn);
    const fn=fwd.dot(tn); let target;
    if(fn<0||fn>0.3) target=tn; else target=V().copy(tn).addScaledVector(fwd,-fn).normalize();
    tq.setFromUnitVectors(up,target); const part_=IDQ.clone().slerp(tq,Math.min(1,dt*8)); q.premultiply(part_).normalize();
    omega.z=0;
  } else if(r2>surf+GH+0.3) onGround=false;
}

function ufoStep(dt){
  n.copy(pos).normalize();
  fwd.set(0,0,-1).applyQuaternion(q);let h0=V().copy(fwd).addScaledVector(n,-fwd.dot(n));
  if(h0.lengthSq()<1e-6)h0.copy(camHead);h0.normalize();
  h0.applyAxisAngle(n,ax.r*1.5*AC.Rl*UP.hand*dt).normalize();
  const rt=V().crossVectors(h0,n);
  thr+=(Math.max(0,dialVal)-thr)*Math.min(1,dt*2);
  const vf=vel.dot(h0),vs=vel.dot(rt),vv=vel.dot(n);
  const tf=dialVal>=0?dialVal*AC.V*UP.eng:dialVal*60, ts=-ax.y*70, tv=ax.p*110*UP.hand;
  const k1=Math.min(1,dt*(1.1+0.4*UP.eng)),k2=Math.min(1,dt*3);
  const nf=vf+(tf-vf)*k1,ns=vs+(ts-vs)*k2,nv=vv+(tv-vv)*k2;
  vel.copy(h0).multiplyScalar(nf).addScaledVector(rt,ns).addScaledVector(n,nv);
  pos.addScaledVector(vel,dt);
  const r2=pos.length();n.copy(pos).divideScalar(r2);
  if(r2>R+3000){pos.copy(n).multiplyScalar(R+3000);const o=vel.dot(n);if(o>0)vel.addScaledVector(n,-o);}
  const h=Hn(n),surf=R+Math.max(0,h)+GH;
  if(r2<surf){
    const tn=(h>0&&vel.length()>40)?terrainNormal(n,V()):n.clone(),vin=vel.dot(tn);
    if(vin<-UP.gearV){if(absorb())return;crash(h<=0);return;}
    pos.copy(n).multiplyScalar(surf);if(vin<0)vel.addScaledVector(tn,-vin);
    const o=vel.dot(n);if(o<0)vel.addScaledVector(n,-o);
    onGround=true;
  } else if(r2>surf+0.3) onGround=false;
  stalled=false;
  q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(rt,n,V().copy(h0).negate()));
  tq.setFromAxisAngle(V(1,0,0),-clamp(nf/AC.V,-.3,1)*0.18+ax.p*0.12);q.multiply(tq);
  tq.setFromAxisAngle(V(0,0,1),ax.r*0.3-ax.y*0.15);q.multiply(tq);
}

function droneStep(dt){
  n.copy(pos).normalize();
  hd.addScaledVector(n,-hd.dot(n)).normalize(); hd.applyAxisAngle(n,ax.y*2.2*dt);
  const rt=V().crossVectors(hd,n);
  const vv=vel.dot(n), hv=V().copy(vel).addScaledVector(n,-vv);
  const inp=V().copy(hd).multiplyScalar(ax.p).addScaledVector(rt,-ax.r), il=Math.min(1,inp.length());
  hv.addScaledVector(inp,120*UP.dAcc*(1+hv.length()/200)*dt);
  hv.multiplyScalar(Math.exp(-(0.02+(1.5+(dGround?2:0))*(1-il))*dt));
  if(hv.length()>DMAX*UP.dMax)hv.setLength(DMAX*UP.dMax);
  const nvv=vv+(dialVal*150-vv)*Math.min(1,dt*3);
  vel.copy(hv).addScaledVector(n,nvv); pos.addScaledVector(vel,dt);
  const r2=pos.length(); n.copy(pos).divideScalar(r2);
  if(r2>R+3000){pos.copy(n).multiplyScalar(R+3000);const o=vel.dot(n);if(o>0)vel.addScaledVector(n,-o);}
  const h=Hn(n), surf=R+Math.max(0,h)+DG;
  if(r2<surf){
    const tn=(h>0&&vel.length()>40)?terrainNormal(n,V()):n.clone(), vin=vel.dot(tn);
    if(vin<-30){if(h>0&&absorb())return;crash(h<=0);return;}
    pos.copy(n).multiplyScalar(surf); if(vin<0)vel.addScaledVector(tn,-vin);
    const o=vel.dot(n); if(o<0)vel.addScaledVector(n,-o);
    dGround=true;
  } else if(r2>surf+0.3) dGround=false;
  hd.addScaledVector(n,-hd.dot(n)).normalize();
  q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V().crossVectors(hd,n),n,V().copy(hd).negate()));
  tq.setFromAxisAngle(V(1,0,0),-ax.p*0.4); q.multiply(tq); tq.setFromAxisAngle(V(0,0,1),ax.r*0.4); q.multiply(tq);
}

modeBtn.addEventListener('click',()=>{
  if(crashed) return;
  n.copy(pos).normalize();
  if(mode==='plane'){
    fwd.set(0,0,-1).applyQuaternion(q); const hf=V().copy(fwd).addScaledVector(n,-fwd.dot(n));
    hd.copy(hf.lengthSq()>1e-4?hf.normalize():camHead);
    if(onGround) pos.setLength(pos.length()-GH+DG);
    mode='drone'; dGround=onGround; dialVal=0; camOff.subVectors(camPos,pos);
  } else {
    q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V().crossVectors(hd,n),n,V().copy(hd).negate())); omega.set(0,0,0);
    if(dGround){vel.set(0,0,0);onGround=true;pos.setLength(pos.length()-DG+GH);dialVal=0;thr=0;}
    else{vel.copy(hd).multiplyScalar(AC.ufo?0:clamp(vel.dot(hd),AC.vmin,AC.vmin*1.8));onGround=false;dialVal=AC.ufo?0:0.6;thr=dialVal;}
    mode='plane';
  }
  plane.visible=mode==='plane'; drone.visible=mode==='drone';
  modeBtn.textContent=mode==='plane'?'Drone':'Plane'; renderDial(); updControls();
});

const toastsEl=document.getElementById('toasts'),coinsEl=document.getElementById('coins'),shBox=document.getElementById('shBox'),shdEl=document.getElementById('shd');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;toastsEl.appendChild(d);
  while(toastsEl.children.length>3)toastsEl.firstChild.remove();setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),400);},2200);}
function earn(n,why){SAVE.coins+=n;save();updHud();toast(`+${n}  ${why}`);}
function updHud(){coinsEl.textContent=SAVE.coins;shBox.hidden=UP.shieldMax<=0;shdEl.textContent=shield;}
updHud();

function absorb(){
  if(shield<=0)return false;
  shield--;shieldT=0;updHud();toast('Airframe absorbed the hit');
  n.copy(pos).normalize();
  const sf=R+Math.max(0,Hn(n))+(mode==='plane'?GH:DG)+2; if(pos.length()<sf)pos.copy(n).multiplyScalar(sf);
  const tang=V().copy(vel).addScaledVector(n,-vel.dot(n)).multiplyScalar(.5);
  vel.copy(tang).addScaledVector(n,10);
  if(mode==='plane'){const f=tang.lengthSq()>1?tang.clone().normalize():V().copy(camHead).addScaledVector(n,-camHead.dot(n)).normalize();
    q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V().crossVectors(f,n),n,f.clone().negate()));omega.set(0,0,0);onGround=false;}
  else dGround=false;
  return true;
}

let airT=0;
const prevPos=V();
function segDist(a,b,p){const ab=V().subVectors(b,a),l=ab.lengthSq();const t=l>1e-9?clamp(V().subVectors(p,a).dot(ab)/l,0,1):0;return a.clone().addScaledVector(ab,t).distanceTo(p);}

function gameTick(dt){
  // rings
  for(const c of COURSES){
    if(c.done){c.resetT-=dt;if(c.resetT<=0){c.done=false;c.rings.forEach(r=>r.got=false);}}
    let next=-1;
    c.rings.forEach((r,i)=>{
      if(!r.got&&!crashed&&r.p.distanceToSquared(pos)<250000&&segDist(prevPos,pos,r.p)<5.2){r.got=true;earn(10,'Ring');}
      if(!r.got&&next<0)next=i;
    });
    if(next<0&&!c.done){c.done=true;c.resetT=45;earn(c.bonus,c.label+' complete');}
    c.rings.forEach((r,i)=>{const d2=r.p.distanceToSquared(camPos);r.m.visible=!r.got&&d2<1.2e6;
      r.m.material=i===next?c.nextMat:c.ringMat;r.m.scale.setScalar(i===next?1+.1*Math.sin(performance.now()/180):1);});
  }
  // traffic
  for(const nn of NPCS){
    const d=npcDir(nn,dt),tgt=Math.max(0,Hn(d))+nn.agl;nn.alt+=(tgt-nn.alt)*Math.min(1,dt*1.5);
    nn.prev.copy(nn.pos);nn.pos.copy(d).multiplyScalar(R+nn.alt);
    const vis=nn.pos.distanceToSquared(camPos)<4e5;nn.g.visible=vis;
    if(vis){const f=V().subVectors(nn.pos,nn.prev);if(f.lengthSq()>1e-8){f.normalize();const u=V().copy(d);f.addScaledVector(u,-f.dot(u)).normalize();
      nn.g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V().crossVectors(f,u),u,f.clone().negate()));
      if(nn.type==='loop'){tq.setFromAxisAngle(V(0,0,1),(nn.w>0?1:-1)*(nn.kind==='plane'?.35:.15));nn.g.quaternion.multiply(tq);}}
      nn.g.position.copy(nn.pos);}
    if(!crashed&&nn.pos.distanceToSquared(pos)<40000&&segDist(prevPos,pos,nn.pos)<nn.hitR){
      if(absorb()){vel.addScaledVector(V().subVectors(pos,nn.pos).normalize(),15);}else crash(false);
    }
  }
  if(crashed)return;
  // shield recharge
  if(shield<UP.shieldMax){shieldT+=dt;if(shieldT>20){shield++;shieldT=0;updHud();}}
  // sights
  const np_=V().copy(pos).normalize();
  WONDERS.forEach((w,i)=>{if(!SAVE.seen.includes(i)&&Math.acos(clamp(np_.dot(w.d),-1,1))*R<90&&pos.length()-w.p.length()<250){SAVE.seen.push(i);earn(150,'New sight: '+w.name);}});
  // landings
  if(mode==='plane'){
    if(!onGround)airT+=dt;
    else if(vel.length()<4){
      if(airT>8){n.copy(pos).normalize();const a=AIRPORTS.find(a=>n.dot(a.c)>Math.cos(0.06)&&Math.abs(n.dot(a.k))<8/R);
        if(a){const first=!SAVE.landed.includes(a.name);if(first)SAVE.landed.push(a.name);earn(first?190:40,first?'First landing at '+a.name:'Landed at '+a.name);}}
      airT=0;}
  } else airT=0;
}

/* ---------- minimap ---------- */
const mm=document.getElementById('minimap'),mx=mm.getContext('2d');
function star(ctx,x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
function drawMinimap(){
  const dpr=Math.min(devicePixelRatio,2),S=mm.clientWidth;if(!S)return;if(mm.width!==Math.round(S*dpr)){mm.width=mm.height=Math.round(S*dpr);}
  const ctx=mx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  const cx=S/2,cy=S/2,rad=S/2-3,np=V().copy(pos).normalize(),fH=V().copy(camHead).addScaledVector(np,-camHead.dot(np)).normalize(),rH=V().crossVectors(fH,np);
  const alt=pos.length()-R,range=320+Math.max(0,alt)*0.6;
  const proj=d=>{const c=clamp(np.dot(d),-1,1),dist=Math.acos(c)*R,t=V().copy(d).addScaledVector(np,-c);const a=Math.atan2(t.dot(rH),t.dot(fH));return {dist,a,r:dist/range*rad};};
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle='rgba(12,30,58,.55)';ctx.fill();ctx.clip();
  // north
  const {N}=enAt(np),na=Math.atan2(N.dot(rH),N.dot(fH));
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='800 10px "Baloo 2",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('N',cx+Math.sin(na)*(rad-8),cy-Math.cos(na)*(rad-8));
  const at=(p)=>[cx+Math.sin(p.a)*p.r,cy-Math.cos(p.a)*p.r];
  // rings
  COURSES.forEach(c=>{const r=c.rings.find(z=>!z.got);if(!r)return;const p=proj(V().copy(r.p).normalize());if(p.r>rad-4)return;const [x,y]=at(p);
    ctx.beginPath();ctx.arc(x,y,3.4,0,Math.PI*2);ctx.strokeStyle='#5ff2ff';ctx.lineWidth=1.8;ctx.stroke();});
  // traffic
  NPCS.forEach(nn=>{const p=proj(V().copy(nn.pos).normalize());if(p.r>rad-3)return;const [x,y]=at(p);ctx.fillStyle=nn.kind==='car'?'#7ff9ff':'#ffffff';ctx.fillRect(x-1.5,y-1.5,3,3);});
  ctx.restore();
  // POIs (on map or on rim)
  let nearA=null,nearW=null;
  const pois=AIRPORTS.map(a=>({k:'a',d:a.c,o:a})).concat(WONDERS.map(w=>({k:'w',d:w.d,o:w})));
  pois.forEach(pp=>{const p=proj(pp.d);pp.p=p;if(pp.k==='a'){if(!nearA||p.dist<nearA.p.dist)nearA=pp;}else if(!nearW||p.dist<nearW.p.dist)nearW=pp;});
  pois.forEach(pp=>{const p=pp.p,off=p.r>rad-7;const rr=off?rad-5:p.r,x=cx+Math.sin(p.a)*rr,y=cy-Math.cos(p.a)*rr;
    ctx.save();ctx.translate(x,y);
    if(pp.k==='a'){ctx.fillStyle=off?'rgba(255,255,255,.6)':'#ffffff';
      if(off){ctx.rotate(p.a);ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(3.5,3);ctx.lineTo(-3.5,3);ctx.closePath();ctx.fill();}
      else{const t=pp.o.t,ang=Math.atan2(t.dot(rH),t.dot(fH));ctx.rotate(ang);ctx.fillRect(-1.6,-7,3.2,14);}}
    else{ctx.fillStyle=off?'rgba(255,201,60,.6)':'#ffc93c';star(ctx,0,0,off?3.5:5);ctx.fill();}
    ctx.restore();});
  const label=(pp,txt)=>{if(!pp||pp.p.r<=rad-7)return;ctx.font='800 9px "Baloo 2",system-ui';const tw=ctx.measureText(txt).width/2+3;
    const x=clamp(cx+Math.sin(pp.p.a)*(rad-17),tw,S-tw),y=clamp(cy-Math.cos(pp.p.a)*(rad-17),8,S-8);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(txt,x,y);ctx.fillStyle='#fff';ctx.fillText(txt,x,y);};
  const mi=d=>Math.round(d/R*3959).toLocaleString()+' mi';
  label(nearA,nearA&&nearA.o.name+' '+mi(nearA.p.dist));label(nearW,nearW&&mi(nearW.p.dist));
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#ff5a4f';ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx+5,cy+5);ctx.lineTo(cx,cy+2.5);ctx.lineTo(cx-5,cy+5);ctx.closePath();ctx.fill();ctx.stroke();
}

/* ---------- world map ---------- */
const wmEl=document.getElementById('worldmap'),wmc=document.getElementById('wmcanvas'),wctx=wmc.getContext('2d');
const landImg=(()=>{const c=document.createElement('canvas');c.width=720;c.height=360;const x=c.getContext('2d'),im=x.createImageData(720,360);
  for(let i=0;i<360;i++)for(let j=0;j<720;j++){const k=i*720+j,lat=90-(i+.5)*.5,lon=-180+(j+.5)*.5,land=SDF[k]>0;
    let col=land?(Math.abs(lat)>62?[233,241,248]:desert(lat,lon)>.5?[230,200,138]:[108,189,72]):[47,143,232];
    im.data.set([col[0],col[1],col[2],255],k*4);}
  x.putImageData(im,0,0);return c;})();
function drawWorld(){
  const dpr=Math.min(devicePixelRatio,2),W=innerWidth,Hh=innerHeight;wmc.width=W*dpr;wmc.height=Hh*dpr;
  const ctx=wctx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a1430';ctx.fillRect(0,0,W,Hh);
  const mw=Math.min(W-24,(Hh-24)*2),mh=mw/2,ox=(W-mw)/2,oy=(Hh-mh)/2;
  ctx.imageSmoothingEnabled=true;ctx.drawImage(landImg,ox,oy,mw,mh);
  const xy=(lat,lon)=>[ox+(lon+180)/360*mw,oy+(90-lat)/180*mh];
  const ll=d=>[Math.asin(clamp(d.y,-1,1))*R2D,Math.atan2(d.x,d.z)*R2D];
  ctx.textAlign='left';ctx.textBaseline='middle';
  const txt=(t,x,y,s)=>{ctx.font=`800 ${s}px "Baloo 2",system-ui`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(t,x,y);ctx.fillStyle='#fff';ctx.fillText(t,x,y);};
  const small=mw<700;
  WONDERS.forEach((w,i)=>{const [x,y]=xy(w.lat,w.lon);ctx.fillStyle=SAVE.seen.includes(i)?'#ffc93c':'#fff3c4';star(ctx,x,y,5);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.stroke();});
  const cl=w=>w.lat>25&&w.lat<39&&w.lon>20&&w.lon<46;
  if(!small)WONDERS.forEach(w=>{if(cl(w))return;const [x,y]=xy(w.lat,w.lon);txt(w.name,x+7,y,10);});
  {const [x,y]=xy(23,30);txt(WONDERS.filter(cl).length+' wonders',x-20,y,small?9:10);}
  AIRPORTS.forEach(a=>{const [x,y]=xy(a.lat,a.lon);ctx.fillStyle='#fff';ctx.fillRect(x-4,y-4,8,8);ctx.strokeStyle='#1d2a44';ctx.lineWidth=1.5;ctx.strokeRect(x-4,y-4,8,8);txt(a.name,x+7,y,12);});
  const np=V().copy(pos).normalize(),[la,lo]=ll(np),[px,py]=xy(la,lo),{N,E}=enAt(np),hh=Math.atan2(camHead.dot(E),camHead.dot(N));
  ctx.save();ctx.translate(px,py);ctx.rotate(hh);ctx.fillStyle='#ff5a4f';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(7,7);ctx.lineTo(0,3);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  txt(`Sights ${SAVE.seen.length}/${WONDERS.length}  ·  Airports landed ${SAVE.landed.length}/${AIRPORTS.length}  ·  Tap to close`,ox+8,oy+mh-12,12);
}
mm.addEventListener('pointerdown',e=>{e.preventDefault();paused=true;wmEl.hidden=false;drawWorld();});
wmEl.addEventListener('pointerdown',e=>{e.preventDefault();wmEl.hidden=true;paused=!hgEl.hidden;});

/* ---------- hangar ---------- */
const hgEl=document.getElementById('hangar'),hgList=document.getElementById('hglist'),hgCoins=document.getElementById('hgcoins');
const hx=n=>'#'+n.toString(16).padStart(6,'0');
function applyPaint(){const c=PAINTS[SAVE.paint].c;red.color.copy(C(c[0]));cream.color.copy(C(c[1]));yellow.color.copy(C(c[2]));}
applyPaint();
function selectAircraft(id){
  const wasAir=mode==='plane'&&!onGround&&!crashed;SAVE.ac=id;save();showModel(id);applyUpgrades();shield=UP.shieldMax;updHud();updControls();
  if(mode==='plane'&&!crashed){if(wasAir)spawn();else{n.copy(pos).normalize();pos.copy(n).multiplyScalar(R+Math.max(0,Hn(n))+GH);vel.set(0,0,0);}}
}
const bars=v=>`<span class="bars">${[1,2,3,4,5].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</span>`;
function trackRow(t,L){const max=L>=5,cost=COST[L];
  return `<div class="row"><div class="info"><b>${t.name}</b><small>${t.desc}</small><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<L?'on':''}"></i>`).join('')}</div></div>
    <button class="buy" data-t="${t.id}" ${max||SAVE.coins<cost?'disabled':''}>${max?'Max':cost+' coins'}</button></div>`;}
function renderHangar(){
  hgCoins.textContent=SAVE.coins;
  let h=`<div class="sec">Aircraft</div><div class="acs">${AIRCRAFT.map(a=>{const own=SAVE.owned.includes(a.id),sel=SAVE.ac===a.id;
    return `<button class="ac ${sel?'sel':''}" data-a="${a.id}" ${!own&&SAVE.coins<a.price?'disabled':''}><b>${a.name}</b><small>${a.desc}</small>
      <span class="st">Speed ${bars(a.stats[0])}</span><span class="st">Agility ${bars(a.stats[1])}</span><span class="st">Tough ${bars(a.stats[2])}</span>
      <em>${sel?'Flying':own?'Fly':a.price.toLocaleString()+' coins'}</em></button>`;}).join('')}</div>`;
  h+=`<div class="sec">Upgrades · ${AC.name}</div>`;
  h+=TRACKS.map(t=>trackRow(t,SAVE.alv[SAVE.ac][t.id])).join('');
  h+=`<div class="sec">Drone</div>`+trackRow(DRONE_TRACK,SAVE.lv.drone||0);
  h+=`<div class="sec">Paint</div>`;
  h+=`<div class="paints">${PAINTS.map((p,i)=>{const own=SAVE.paints.includes(i);
    return `<button class="sw ${SAVE.paint===i?'sel':''}" data-p="${i}" ${!own&&SAVE.coins<p.price?'disabled':''}><span style="background:linear-gradient(135deg,${hx(p.c[0])} 0 50%,${hx(p.c[1])} 50% 80%,${hx(p.c[2])} 80%)"></span>${p.name}<small>${own?(SAVE.paint===i?'In use':'Owned'):p.price+' coins'}</small></button>`;}).join('')}</div>`;
  hgList.innerHTML=h;
}
hgList.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.a){const id=b.dataset.a;if(!SAVE.owned.includes(id)){const a=ACS[id];if(SAVE.coins<a.price)return;SAVE.coins-=a.price;SAVE.owned.push(id);}selectAircraft(id);}
  else if(b.dataset.t){const id=b.dataset.t,lv=id==='drone'?SAVE.lv:SAVE.alv[SAVE.ac],L=lv[id]||0;if(L>=5||SAVE.coins<COST[L])return;SAVE.coins-=COST[L];lv[id]=L+1;
    const had=UP.shieldMax;applyUpgrades();if(id==='airframe')shield=Math.min(UP.shieldMax,shield+(UP.shieldMax-had));}
  else{const i=+b.dataset.p;if(!SAVE.paints.includes(i)){if(SAVE.coins<PAINTS[i].price)return;SAVE.coins-=PAINTS[i].price;SAVE.paints.push(i);}SAVE.paint=i;applyPaint();}
  save();updHud();renderHangar();});
document.getElementById('hangarBtn').addEventListener('click',()=>{renderHangar();hgEl.hidden=false;paused=true;});
document.getElementById('hgclose').addEventListener('click',()=>{hgEl.hidden=true;paused=!wmEl.hidden;});

/* ---------- loop ---------- */
spawn();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  const ki=Math.min(1,dt*6);
  let tP,tR,tY;
  if(mode==='plane'){tP=RS.y;tR=-RS.x;tY=input.rl-input.rr;}
  else{tP=-RS.y;tR=-RS.x;tY=-LS.x;dialVal=-LS.y;}
  ax.p+=(tP-ax.p)*ki; ax.r+=(tR-ax.r)*ki; ax.y+=(tY-ax.y)*ki;

  if(!paused){ prevPos.copy(pos);
  if(!crashed){
    if(mode==='plane'){ for(let i=0;i<3;i++){ (AC.ufo?ufoStep:step)(dt/3); if(crashed)break; } }
    else { stalled=false; for(let i=0;i<6;i++){ droneStep(dt/6); if(crashed)break; } }
  } else { crashT+=dt; if(crashT>4.5) spawn(); }
  gameTick(dt);
  }

  if(mode==='plane'){
    plane.position.copy(pos); plane.quaternion.copy(q);
    animAC(dt);
  } else {
    drone.position.copy(pos); drone.quaternion.copy(q);
    drone.userData.rotors.forEach((r,i)=>r.rotation.y+=dt*(i%3?-1:1)*(dGround&&dialVal<=0?6:60));
  }
  updDebris(dt);
  puffs.forEach(p=>{if(!p.m.visible)return;p.t+=dt;p.m.position.addScaledVector(p.v,dt);p.v.multiplyScalar(Math.exp(-dt*1.5));
    p.m.scale.setScalar(.6+p.t*1.6);p.m.material.opacity=Math.max(0,.75-p.t/3.2);if(p.t>2.4)p.m.visible=false;});
  clouds.rotation.y+=dt*0.004;

  // camera: follows the heading, horizon locked to the globe
  fwd.set(0,0,-1).applyQuaternion(q); n.copy(pos).normalize();
  const isD=mode==='drone';
  const hf=isD?V().copy(hd):V().copy(fwd).addScaledVector(n,-fwd.dot(n)), hl=hf.length();
  camHead.addScaledVector(n,-camHead.dot(n)).normalize();
  if(hl>1e-3){hf.divideScalar(hl);
    const ang=Math.atan2(V().crossVectors(camHead,hf).dot(n),camHead.dot(hf));
    camHead.applyAxisAngle(n,ang*(1-Math.exp(-dt*(isD?8:4)*Math.min(1,hl*3)))).normalize();}
  const el=isD?0:clamp(Math.asin(clamp(fwd.dot(n),-1,1)),-0.9,0.9);
  const back=V().copy(camHead).multiplyScalar(Math.cos(el)).addScaledVector(n,Math.sin(el));
  const tgt=V().copy(pos).addScaledVector(back,isD?-11:-AC.cam[0]).addScaledVector(n,isD?3.5:AC.cam[1]);
  if(isD){camOff.lerp(tgt.sub(pos),1-Math.exp(-dt*6));camPos.copy(pos).add(camOff);}
  else camPos.lerp(tgt,1-Math.exp(-dt*5));
  const cn=V().copy(camPos).normalize(), cr=camPos.length(), cmin=R+Math.max(0,Hn(cn))+1.5; if(cr<cmin)camPos.copy(cn).multiplyScalar(cmin);
  cn.copy(camPos).normalize();
  camera.position.copy(camPos); camera.up.copy(cn); camera.lookAt(V().copy(pos).addScaledVector(back,8));

  // sky & light
  const camAlt=camPos.length()-R, se=cn.dot(SUN), day=sstep(-0.28,0.22,se), tw=Math.exp(-se*se*28)*0.8, space=sstep(500,1600,camAlt);
  const zen=SKY.zenN.clone().lerp(SKY.zenD,day).lerp(SKY.space,space);
  const hor=SKY.horN.clone().lerp(SKY.horD,day).lerp(SKY.tw,tw*(0.4+0.6*(1-day))).lerp(SKY.space,space*0.55);
  skyMat.uniforms.uZen.value.copy(zen); skyMat.uniforms.uHor.value.copy(hor); skyMat.uniforms.uUp.value.copy(cn);
  sky.position.copy(camPos); stars.position.copy(camPos); starMat.opacity=Math.max(1-day,space)*0.9;
  scene.fog.color.copy(hor).convertSRGBToLinear(); scene.fog.near=90+camAlt; scene.fog.far=620+camAlt*3;
  sun.position.copy(pos).addScaledVector(SUN,200); sun.target.position.copy(pos);


  // hud
  const agl=pos.length()-(R+Math.max(0,Hn(n)))-(isD?DG:GH);
  spdEl.textContent=Math.round(vel.length()*1.944); altEl.textContent=Math.max(0,Math.round(agl*3.28));
  warnEl.classList.toggle('show',stalled&&!crashed);
  drawMinimap();

  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
</html>
